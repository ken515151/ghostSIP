;=============================================================================
; GhostSIP — RTP port range for relayed callback audio.
;
; Narrowed from Asterisk's default 10000-20000 to 10000-10500: a relayed
; call uses ~4 UDP ports (two per leg), so 500 ports covers far more
; concurrent callbacks than this ever sees, with a much smaller open range.
; MUST match the firewall rule in docs/deployment.md (udp 10000-10500).
;=============================================================================
[general]
rtpstart=10000
rtpend=10500

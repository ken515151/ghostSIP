;=============================================================================
; GhostSIP — module loading. PJSIP is the only channel driver we use.
;
; The container smoke test caught Ubuntu's asterisk autoloading the
; DEPRECATED legacy chan_sip, which binds 0.0.0.0:5060 unconfigured —
; re-opening the exact port we deliberately moved off, with a stack nobody
; configured. Never load it, nor the other unused channel drivers that
; grab their own ports (IAX2: 4569/udp, MGCP: 2427/udp, Unistim: 5000/udp).
;=============================================================================
[modules]
autoload=yes

; --- Unused channel drivers (each would bind its own port) ---
noload => chan_sip.so
noload => chan_iax2.so
noload => chan_mgcp.so
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_ooh323.so

; --- Voicemail: GhostSIP has no voicemail and the dialplan has no route to
; it, but Ubuntu ships voicemail.conf with a SAMPLE mailbox (1234 / PIN
; 4242). Not loading the modules removes that entirely rather than relying
; on "there's no route", and drops the voicemail errors from the boot log.
noload => app_voicemail.so
noload => app_voicemail_imap.so
noload => app_voicemail_odbc.so

; --- ODBC: nothing here uses a database via Asterisk (settings live in
; Django/SQLite; Asterisk has no realtime config). Ubuntu's res_odbc.conf
; ships sample DSN credentials (myuser/mypass, oscar/thegrouch) — disabled
; and outbound-only, so inert, but there is no reason to keep them loaded.
; The WHOLE family goes together: res_odbc has dependent modules, and
; noloading it alone would leave them failing noisily at every boot.
noload => res_odbc.so
noload => res_odbc_transaction.so
noload => res_config_odbc.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cel_odbc.so
noload => func_odbc.so
; NOTE: cdr_csv stays loaded — it is what records callback durations to
; /var/log/asterisk/cdr-csv/Master.csv (see docs).

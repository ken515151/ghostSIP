;=============================================================================
; GhostSIP — dialplan
;
; Security posture (spec §4.1): the ONLY permitted flow is
; phone endpoint → out via the VoIPstudio trunk-back seat. A compromised
; phone credential must not be able to reach anything else.
;=============================================================================

[general]
static=yes
writeprotect=yes

;-----------------------------------------------------------------------------
; Callbacks: a tapped missed-call entry dials the abandoned caller's number
; on the GhostSIP line; relay it straight out through VoIPstudio.
; Caller ID is left to VoIPstudio — the trunk seat presents the account's
; own outbound CLI, which is exactly what we want (spec §6: no CLI spoofing).
;-----------------------------------------------------------------------------
[from-phones]
; UK national numbers ONLY (0 + digits, second digit 1-9 so 00-international
; never matches). Ghost entries always display the normalised national form,
; so every legitimate tap-to-callback fits this pattern — and international
; premium destinations, the target of essentially all SIP toll fraud, are
; unroutable even with a stolen phone credential. Deliberately loosen this
; if a foreign caller ever genuinely needs tap-back; better, also set
; international call barring on the trunk-back seat in VoIPstudio itself.
; Lockdown gate: when the receiver sets the GHOSTSIP_LOCKDOWN global (via
; ARI — instant, no reload), ALL outbound relaying is refused. Ghost-call
; injection and the phones' normal VoIPstudio line are unaffected; only
; tap-to-callback pauses. See receiver/lockdown.py.
exten => _0[1-9]X.,1,GotoIf($["${GLOBAL(GHOSTSIP_LOCKDOWN)}"="1"]?locked)
 same => n,NoOp(GhostSIP callback: ${CHANNEL(endpoint)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@voipstudio,60)
 same => n,Hangup()
 same => n(locked),NoOp(GhostSIP: LOCKDOWN active — refusing outbound ${EXTEN} from ${CHANNEL(endpoint)})
 same => n,Congestion(3)
 same => n,Hangup()

; Everything else — international, service codes, non-numeric — refuse.
exten => _.,1,NoOp(GhostSIP: refusing dial ${EXTEN} from ${CHANNEL(endpoint)})
 same => n,Congestion(2)
 same => n,Hangup()

;-----------------------------------------------------------------------------
; Inbound calls arriving on the trunk-back seat: not part of any GhostSIP
; flow (nothing should ring this seat). Drop them.
;-----------------------------------------------------------------------------
[from-voipstudio]
exten => _.,1,NoOp(GhostSIP: unexpected inbound on trunk-back seat, dropping)
 same => n,Hangup()

;-----------------------------------------------------------------------------
; Ghost-call landing context: ARI originates INVITE → phone with
; extension=s in this context. Normal case: the 4 s originate timeout
; expires first and Asterisk CANCELs (never answered, no media). If someone
; DOES answer a ghost call before the CANCEL, we land here — hang up
; immediately (dead-air non-event, spec §4.3).
;-----------------------------------------------------------------------------
[ghost-answered]
exten => s,1,NoOp(GhostSIP: ghost call answered on ${CHANNEL(endpoint)}, hanging up)
 same => n,Hangup()

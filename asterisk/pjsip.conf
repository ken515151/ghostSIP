;=============================================================================
; GhostSIP — PJSIP configuration  [REFERENCE COPY]
;
; NOTE: In deployment this file is GENERATED by the admin panel from
; config.json (receiver/asterisk_config.py). This hand-written copy is kept
; as a readable reference of the structure. Do not deploy it directly if you
; use the panel — it will be overwritten on the first save.
;
; Roles:
;   1. Registrar for the shop's VVX handsets (their GhostSIP line).
;   2. Outbound registration to VoIPstudio via the dedicated trunk-back seat,
;      used ONLY to relay callbacks dialled on the GhostSIP line.
;
; Replace every CHANGE-ME before deploying. One [phoneN] block trio per
; handset; add more by copying the Phone 1 section.
;=============================================================================

;-----------------------------------------------------------------------------
; Transport
;-----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
; Non-standard port on purpose (scanner noise); GUI-configurable, default 5560
bind=0.0.0.0:5560
allow_reload=yes
; If the VPS itself is behind NAT (most aren't), also set:
; external_media_address=VPS_PUBLIC_IP
; external_signaling_address=VPS_PUBLIC_IP

;-----------------------------------------------------------------------------
; Handset templates
;-----------------------------------------------------------------------------
[vvx-endpoint](!)
type=endpoint
context=from-phones          ; ONLY route permitted: out via VoIPstudio trunk
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[vvx-auth](!)
type=auth
auth_type=userpass

[vvx-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60
; Cap granted registration to 2 min (phones default to 3600), so a phone
; re-registers on its own within ~2 min after a container rebuild.
maximum_expiration=120
minimum_expiration=60
default_expiration=120

;-----------------------------------------------------------------------------
; Phone 1 (VVX 600 — repeat this trio per handset)
;-----------------------------------------------------------------------------
[phone1](vvx-endpoint)
auth=phone1
aors=phone1

[phone1](vvx-auth)
username=phone1
password=CHANGE-ME-long-random-secret

[phone1](vvx-aor)

;-----------------------------------------------------------------------------
; Trunk-back seat: Asterisk registers to VoIPstudio as an ordinary user.
; Pre-purchase check (spec §4.1): confirm the new seat exposes SIP
; username/password/registrar for third-party devices.
;-----------------------------------------------------------------------------
[voipstudio-reg]
type=registration
outbound_auth=voipstudio-auth
server_uri=sip:sip.voipstudio.com
client_uri=sip:CHANGE-ME-TRUNKBACK-USER@sip.voipstudio.com
retry_interval=60
forbidden_retry_interval=300
expiration=300
line=yes
endpoint=voipstudio

[voipstudio-auth]
type=auth
auth_type=userpass
username=CHANGE-ME-TRUNKBACK-USER
password=CHANGE-ME-TRUNKBACK-PASS

[voipstudio]
type=endpoint
context=from-voipstudio      ; inbound to the trunk seat is not a GhostSIP flow
outbound_auth=voipstudio-auth
aors=voipstudio
disallow=all
allow=ulaw
allow=alaw
from_user=CHANGE-ME-TRUNKBACK-USER
from_domain=sip.voipstudio.com
direct_media=no
rtp_symmetric=yes

[voipstudio]
type=aor
contact=sip:sip.voipstudio.com

[voipstudio-identify]
type=identify
endpoint=voipstudio
match=sip.voipstudio.com

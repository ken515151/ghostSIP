; GhostSIP — supervisord runs Asterisk and the receiver side by side in the
; one container. Both log to the container's stdout (docker compose logs).
[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:receiver]
; --proxy-headers: Caddy fronts this on loopback, so trust X-Forwarded-For
; from 127.0.0.1 only — request.client.host then shows the REAL visitor IP
; (for failed-login logging and rate limiting), not 127.0.0.1.
command=/opt/ghostsip/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8100 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/opt/ghostsip/receiver
; Same unprivileged user as Asterisk: no root inside the container for the
; internet-facing process. The asterisk user owns /etc/ghostsip (config +
; generated pjsip.conf), the control socket for `asterisk -rx`, and the
; security log the alert watcher tails.
user=asterisk
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

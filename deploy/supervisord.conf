; GhostSIP — supervisord runs Asterisk and the receiver side by side in the
; one container. Both log to the container's stdout (docker compose logs).
[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:receiver]
command=/opt/ghostsip/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8100
directory=/opt/ghostsip/receiver
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

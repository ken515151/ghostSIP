; GhostSIP — supervisord runs three processes in the one container:
; Asterisk, the Django app (gunicorn), and the security-log watcher.
; All log to the container's stdout (docker compose logs).
[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:web]
command=/opt/ghostsip/venv/bin/gunicorn ghostsip.wsgi:application --bind 127.0.0.1:8100 --workers 2 --timeout 30
directory=/opt/ghostsip/receiver
; Same unprivileged user as Asterisk: no root for the internet-facing app.
; The asterisk user owns /etc/ghostsip (db, config, generated pjsip.conf),
; the control socket for `asterisk -rx`, and the security log the watcher tails.
user=asterisk
priority=20
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:watcher]
command=/opt/ghostsip/venv/bin/python manage.py watch_security_log
directory=/opt/ghostsip/receiver
user=asterisk
priority=30
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
